
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Georgia', serif;
  background: #fdf8f4;
}

/* Watercolor backdrop */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(232, 196, 208, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 30%, rgba(196, 218, 232, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(218, 232, 196, 0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 10% 70%, rgba(232, 218, 196, 0.3) 0%, transparent 40%),
    radial-gradient(ellipse at 90% 80%, rgba(216, 196, 232, 0.25) 0%, transparent 45%);
  pointer-events: none;
  z-index: 0;
}

/* Navigation via radio buttons */
input[name="view"], input[name="flash"] { display: none; }

.view { display: none; position: relative; z-index: 1; height: 100vh; }
#view-camera:checked ~ .camera-view { display: flex; }
#view-preview:checked ~ .preview-view { display: flex; }
#view-gallery:checked ~ .gallery-view { display: flex; }

/* ===== CAMERA VIEW ===== */
.camera-view {
  flex-direction: column;
  align-items: center;
  height: 100vh;
  padding: 12px 16px;
  justify-content: space-between;
}

.camera-header {
  text-align: center;
  flex-shrink: 0;
}

.camera-header h1 {
  font-size: 18px;
  color: #5a4a4a;
  font-weight: 400;
  letter-spacing: 0.05em;
}

.camera-header p {
  font-size: 11px;
  color: #9a8a8a;
  margin-top: 2px;
  font-style: italic;
}

.viewfinder {
  width: 100%;
  max-width: 320px;
  flex: 1;
  min-height: 0;
  max-height: calc(100vh - 180px);
  background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  margin: 10px 0;
}

.viewfinder::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 50px; height: 50px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
}

.viewfinder::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 6px; height: 6px;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
}

.viewfinder-grid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}

.viewfinder-grid span {
  border: 0.5px solid rgba(255,255,255,0.08);
}

.camera-top-bar {
  position: absolute;
  top: 10px; left: 10px; right: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.flash-toggle, .flip-toggle {
  width: 34px; height: 34px;
  background: rgba(0,0,0,0.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
  cursor: pointer;
}

.flash-toggle svg, .flip-toggle svg {
  width: 16px; height: 16px;
  fill: #fff;
}

/* Flash states */
.flash-off-state, .flash-on-state, .flash-auto-state { display: none; }
#flash-off:checked ~ .camera-view .flash-off-state { display: flex; }
#flash-on:checked ~ .camera-view .flash-on-state { display: flex; }
#flash-auto:checked ~ .camera-view .flash-auto-state { display: flex; }

.flash-indicator {
  position: absolute;
  top: 50px;
  left: 10px;
  font-size: 9px;
  color: #ffd700;
  background: rgba(0,0,0,0.5);
  padding: 2px 7px;
  border-radius: 8px;
  letter-spacing: 0.05em;
}

/* Camera controls */
.camera-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  flex-shrink: 0;
  padding-bottom: 8px;
}

.shutter-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: #fff;
  border: 4px solid #e8c4d0;
  position: relative;
  cursor: pointer;
  transition: transform 0.1s ease;
  box-shadow: 0 4px 16px rgba(232, 196, 208, 0.4);
}

.shutter-btn:active {
  transform: scale(0.92);
}

.shutter-btn::after {
  content: '';
  position: absolute;
  top: 5px; left: 5px; right: 5px; bottom: 5px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e8c4d0, #d4a0b0);
}

.ctrl-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(90, 74, 74, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.15s ease;
}

.ctrl-btn:hover {
  background: rgba(90, 74, 74, 0.15);
}

.ctrl-btn svg {
  width: 20px; height: 20px;
  fill: #5a4a4a;
}

.ctrl-btn-label {
  font-size: 9px;
  color: #9a8a8a;
  text-align: center;
  margin-top: 2px;
}

/* ===== PREVIEW VIEW ===== */
.preview-view {
  flex-direction: column;
  align-items: center;
  height: 100vh;
  padding: 12px 16px;
  justify-content: space-between;
}

.preview-header {
  text-align: center;
  flex-shrink: 0;
}

.preview-header h2 {
  font-size: 18px;
  color: #5a4a4a;
  font-weight: 400;
}

.preview-header p {
  font-size: 11px;
  color: #9a8a8a;
  margin-top: 2px;
  font-style: italic;
}

.preview-image {
  width: 100%;
  max-width: 320px;
  flex: 1;
  min-height: 0;
  border-radius: 16px;
  background: linear-gradient(160deg, #f0e6ea 0%, #e6eaf0 40%, #eaf0e6 100%);
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  margin: 10px 0;
}

.preview-image::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    radial-gradient(circle at 30% 40%, rgba(232, 196, 208, 0.3) 0%, transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(196, 218, 232, 0.3) 0%, transparent 40%);
}

.preview-stamp {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(255,255,255,0.85);
  padding: 6px 12px;
  border-radius: 8px;
  backdrop-filter: blur(4px);
}

.preview-stamp span {
  display: block;
  font-size: 10px;
  color: #5a4a4a;
}

.preview-stamp span:first-child {
  font-weight: 600;
  font-size: 12px;
  color: #d4a0b0;
}

.preview-bottom {
  flex-shrink: 0;
  width: 100%;
  max-width: 320px;
}

.preview-actions {
  display: flex;
  gap: 10px;
  width: 100%;
}

.preview-actions label, .preview-actions .action-btn {
  flex: 1;
  padding: 12px 8px;
  border-radius: 12px;
  text-align: center;
  font-size: 12px;
  cursor: pointer;
  transition: transform 0.1s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}

.preview-actions label:active, .preview-actions .action-btn:active {
  transform: scale(0.96);
}

.btn-retake {
  background: #fff;
  border: 1px solid #e0d6d6;
  color: #5a4a4a;
}

.btn-save {
  background: linear-gradient(135deg, #e8c4d0, #d4a0b0);
  color: #fff;
  border: none;
  box-shadow: 0 4px 16px rgba(212, 160, 176, 0.3);
}

.btn-download {
  background: #fff;
  border: 1px solid #c4dae8;
  color: #5a7a8a;
}

.btn-save svg, .btn-retake svg, .btn-download svg {
  width: 14px; height: 14px;
}

.drive-status {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(196, 232, 208, 0.2);
  border-radius: 8px;
  border: 1px solid rgba(196, 232, 208, 0.4);
  margin-bottom: 8px;
}

.drive-status svg {
  width: 16px; height: 16px;
  flex-shrink: 0;
}

.drive-status span {
  font-size: 11px;
  color: #4a7a5a;
}

/* ===== GALLERY VIEW ===== */
.gallery-view {
  flex-direction: column;
  height: 100vh;
  padding: 12px 16px;
}

.gallery-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  flex-shrink: 0;
}

.gallery-header h2 {
  font-size: 18px;
  color: #5a4a4a;
  font-weight: 400;
}

.gallery-count {
  font-size: 11px;
  color: #9a8a8a;
  background: rgba(232, 196, 208, 0.2);
  padding: 3px 10px;
  border-radius: 12px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  flex: 1;
  min-height: 0;
  align-content: start;
}

.gallery-item {
  aspect-ratio: 3/4;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

.gallery-item:nth-child(1) { background: linear-gradient(135deg, #f5e6ea, #e6eaf5); }
.gallery-item:nth-child(2) { background: linear-gradient(135deg, #e6f0ea, #eae6f0); }
.gallery-item:nth-child(3) { background: linear-gradient(135deg, #f0eae6, #e6f0f0); }
.gallery-item:nth-child(4) { background: linear-gradient(135deg, #eae6f0, #f0f0e6); }
.gallery-item:nth-child(5) { background: linear-gradient(135deg, #e6eaf5, #f5eae6); }
.gallery-item:nth-child(6) { background: linear-gradient(135deg, #f0e6f0, #e6f5ea); }

.gallery-item-time {
  position: absolute;
  bottom: 6px;
  left: 6px;
  font-size: 9px;
  color: #fff;
  background: rgba(0,0,0,0.4);
  padding: 2px 6px;
  border-radius: 4px;
  backdrop-filter: blur(4px);
}

.gallery-item-drive {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 16px; height: 16px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gallery-item-drive svg {
  width: 10px; height: 10px;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  gap: 48px;
  padding: 10px 20px 20px;
  border-top: 1px solid rgba(0,0,0,0.05);
  z-index: 100;
}

.bottom-nav label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: #9a8a8a;
  font-size: 9px;
  transition: color 0.15s ease;
}

.bottom-nav label svg {
  width: 20px; height: 20px;
  fill: currentColor;
}

#view-camera:checked ~ .bottom-nav label[for="view-camera"] { color: #d4a0b0; }
#view-preview:checked ~ .bottom-nav label[for="view-camera"] { color: #9a8a8a; }
#view-gallery:checked ~ .bottom-nav label[for="view-gallery"] { color: #d4a0b0; }

/* Animations */
@media (prefers-reduced-motion: no-preference) {
  .camera-view { animation: fadeUp 0.4s ease-out; }
  .preview-view { animation: fadeUp 0.4s ease-out; }
  .gallery-view { animation: fadeUp 0.4s ease-out; }
  .gallery-item { animation: fadeIn 0.4s ease-out both; }
  .gallery-item:nth-child(1) { animation-delay: 0.05s; }
  .gallery-item:nth-child(2) { animation-delay: 0.1s; }
  .gallery-item:nth-child(3) { animation-delay: 0.15s; }
  .gallery-item:nth-child(4) { animation-delay: 0.15s; }
  .gallery-item:nth-child(5) { animation-delay: 0.2s; }
  .gallery-item:nth-child(6) { animation-delay: 0.25s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: none; }
  }
}
</style>
</head>
